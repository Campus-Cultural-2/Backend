name: CI

# `pull_request` (e nao `pull_request_target`) e a decisao de seguranca mais
# importante deste arquivo. Com `pull_request`, um PR vindo de um fork roda
# com token somente-leitura e sem acesso a nenhum segredo. O
# `pull_request_target` roda no contexto do repositorio base, com segredos,
# e e o que permite o ataque conhecido como Poisoned Pipeline Execution:
# alguem abre um PR alterando o proprio workflow ou um script que ele chama,
# e o seu CI executa esse codigo com as suas credenciais.
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

# Menor privilegio possivel. Sem isto, o GITHUB_TOKEN recebe o que estiver
# configurado como padrao na organizacao, que pode incluir escrita.
# Este workflow so precisa ler o codigo.
permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      # Actions sao fixadas no SHA do commit, nao na tag. Uma tag como v4 pode
      # ser movida para outro commit; o SHA nao. O comentario ao lado diz qual
      # versao aquele SHA representa, e o Dependabot atualiza os dois juntos.
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Nao deixa o token do GitHub gravado em .git/config depois do
          # checkout, onde um passo posterior conseguiria ler.
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      # --frozen falha se o uv.lock estiver desatualizado, em vez de resolver
      # versoes novas em silencio. O CI passa a testar exatamente as mesmas
      # versoes que rodam em producao.
      - name: Install dependencies
        run: uv sync --frozen

      - name: Check formatting
        run: uv run task format-check

      - name: Run lint
        run: uv run task lint

      - name: Run tests
        run: uv run task test
