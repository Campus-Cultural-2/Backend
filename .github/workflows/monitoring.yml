name: Monitorar aplicacao

# Verifica periodicamente se a API publicada esta respondendo.
#
# Quando o curl falha, o passo falha, a execucao fica vermelha e o GitHub
# manda e-mail para quem tem o repositorio. Esse e o alerta: nao existe
# servico externo envolvido.
on:
  schedule:
    # A cada 2 horas, no minuto zero. O horario do cron do GitHub Actions e
    # sempre UTC, e a execucao pode atrasar alguns minutos quando a fila esta
    # cheia; para monitoramento isso nao tem problema.
    #
    # CUIDADO com a sintaxe: o campo de minuto so aceita 0 a 59. Escrever
    # "*/90" nao significa "a cada 90 minutos" — o valor satura e acaba
    # rodando de hora em hora, igual a "0 * * * *". Intervalo maior que uma
    # hora se faz no campo de HORA, que e o segundo: "0 */2 * * *".
    #
    # Intervalo maior tambem gasta menos cota do Render. O servico dorme
    # depois de 15 minutos sem trafego, e o plano gratuito da 750 horas por
    # mes. A cada 2 horas ele acorda, fica no ar 15 minutos e volta a dormir:
    # cerca de 90 horas por mes, bem dentro do limite. Para efeito de
    # comparacao, um ping a cada 15 minutos manteria a aplicacao acordada
    # 24/7 e consumiria praticamente toda a cota.
    - cron: "0 */2 * * *"

  # Permite rodar a verificacao na hora, pelo botao "Run workflow".
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health-check:
    runs-on: ubuntu-latest

    steps:
      - name: Verificar /health
        # --fail          faz o curl retornar erro em status HTTP 4xx e 5xx;
        #                 sem isso ele baixaria a pagina de erro e sairia com
        #                 sucesso
        # --silent        esconde a barra de progresso
        # --show-error    mas mantem a mensagem de erro no log
        # --max-time 120  tempo suficiente para o servico acordar (leva cerca
        #                 de 1 minuto), mas ainda falha se estiver travado
        run: |
          curl --fail --silent --show-error --max-time 120 \
            https://campus-cultural-api.onrender.com/health
