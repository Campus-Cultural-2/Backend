info:
  name: Delete Profile Picture Forbidden
  type: http
  seq: 8

http:
  method: DELETE
  url: "{{baseUrl}}/users/{{adminId}}/profile-picture"
  headers:
    - name: accept
      value: application/json
  body:
    type: none
  auth:
    type: bearer
    token: "{{authToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("status is 403", function() {
          expect(res.status).to.equal(403);
        });
        test("error code is permission_denied", function() {
          expect(res.body.code).to.equal("permission_denied");
        });

settings:
  encodeUrl: true

docs: |-
  O estudante tenta remover a foto do admin. Só o próprio usuário ou um admin
  pode trocar ou remover uma foto, porque a remoção apaga a imagem do Cloudinary.

  **Espera:** 403 com `code: permission_denied`.
