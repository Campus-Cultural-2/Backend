info:
  name: Get Profile Picture
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/users/{{studentId}}/profile-picture"
  headers:
    - name: accept
      value: image/*
  body:
    type: none
  auth:
    type: bearer
    token: "{{authToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("status is 200", function() {
          expect(res.status).to.equal(200);
        });
        test("content-type is an image", function() {
          const ct = res.headers["content-type"] || res.headers["Content-Type"];
          expect(ct).to.include("image/");
        });
        test("body is non-empty", function() {
          expect(res.body).to.not.be.empty;
        });

settings:
  encodeUrl: true

docs: |-
  Baixa a foto previamente carregada para o estudante.

  A API responde 307 apontando para o link da foto no Cloudinary; o Bruno
  segue o redirect e baixa a imagem de lá.

  **Espera:** 200, `Content-Type: image/...` e body não vazio.
