info:
  name: List Users
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/users"
  headers:
    - name: accept
      value: application/json
  body:
    type: none
  auth:
    type: bearer
    token: "{{adminToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("status is 200", function() {
          expect(res.status).to.equal(200);
        });
        test("body is an array", function() {
          expect(res.body).to.be.an("array");
          expect(res.body.length).to.be.above(0);
        });
        test("includes seeded student", function() {
          const studentId = Number(bru.getVar("studentId"));
          const found = res.body.find(u => u.id === studentId);
          expect(found, "student in user list").to.not.equal(undefined);
        });

settings:
  encodeUrl: true

docs: |-
  Lista todos os usuários usando `adminToken` (rota exclusiva de professores e admins).

  **Espera:** 200, body como array não vazio contendo o estudante seedado (`studentId`).
