info:
  name: Update User Not Found
  type: http
  seq: 8

http:
  method: PUT
  url: "{{baseUrl}}/users/99999999"
  headers:
    - name: accept
      value: application/json
    - name: content-type
      value: application/json
  body:
    type: json
    data: |-
      {
        "role": "student",
        "email": "ghost-update-{{$timestamp}}@e2e.test",
        "name": "Ghost",
        "last_name": "User",
        "password": "secret123",
        "is_active": true,
        "ra": "RA-GHOST-{{$timestamp}}",
        "birth_date": null
      }
  auth:
    type: bearer
    token: "{{adminToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("status is 404", function() {
          expect(res.status).to.equal(404);
        });
        test("error code is user_not_found", function() {
          expect(res.body.code).to.equal("user_not_found");
        });

settings:
  encodeUrl: true

docs: |-
  Update em id inexistente.

  **Espera:** 404 com `code: user_not_found`.
