info:
  name: List Users Forbidden
  type: http
  seq: 13

http:
  method: GET
  url: "{{baseUrl}}/users"
  headers:
    - name: accept
      value: application/json
  body:
    type: none
  auth:
    type: bearer
    token: "{{studentToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("status is 403", function() {
          expect(res.status).to.equal(403);
        });
        test("error code is permission_denied", function() {
          expect(res.body.code).to.equal("permission_denied");
        });

settings:
  encodeUrl: true

docs: |-
  Estudante tenta listar os usuários. A listagem é exclusiva de professores e admins.

  **Espera:** 403 com `code: permission_denied`.
