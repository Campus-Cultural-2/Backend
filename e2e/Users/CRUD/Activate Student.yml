info:
  name: Activate Student
  type: http
  seq: 15

http:
  method: PATCH
  url: "{{baseUrl}}/users/{{studentId}}/status"
  headers:
    - name: accept
      value: application/json
    - name: content-type
      value: application/json
  body:
    type: json
    data: |-
      {
        "is_active": true
      }
  auth:
    type: bearer
    token: "{{adminToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("status is 200", function() {
          expect(res.status).to.equal(200);
        });
        test("student is active again", function() {
          expect(res.body.is_active).to.equal(true);
        });

settings:
  encodeUrl: true

docs: |-
  Admin reativa o estudante desativado em `Deactivate Student`.

  **Espera:** 200 com `is_active: true`.
