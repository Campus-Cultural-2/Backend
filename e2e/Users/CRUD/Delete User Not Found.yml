info:
  name: Delete User Not Found
  type: http
  seq: 12

http:
  method: DELETE
  url: "{{baseUrl}}/users/99999999"
  headers:
    - name: accept
      value: application/json
  body:
    type: none
  auth:
    type: bearer
    token: "{{adminToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("status is 404", function() {
          expect(res.status).to.equal(404);
        });
        test("error code is user_not_found", function() {
          expect(res.body.code).to.equal("user_not_found");
        });

settings:
  encodeUrl: true

docs: |-
  Delete em id inexistente.

  **Espera:** 404 com `code: user_not_found`.
