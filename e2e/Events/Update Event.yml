info:
  name: Update Event
  type: http
  seq: 7

http:
  method: PUT
  url: "{{baseUrl}}/events/{{eventId}}"
  headers:
    - name: accept
      value: application/json
    - name: content-type
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "Evento E2E Atualizado",
        "description": "Descrição atualizada"
      }
  auth:
    type: bearer
    token: "{{authToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("status is 200", function() {
          expect(res.status).to.equal(200);
        });
        test("only sent fields changed", function() {
          expect(res.body.name).to.equal("Evento E2E Atualizado");
          expect(res.body.description).to.equal("Descrição atualizada");
        });
        test("untouched fields preserved", function() {
          expect(res.body.event_location).to.equal("Laboratório de Informática");
          expect(res.body.has_certificate).to.equal(true);
          expect(res.body.workload_hours).to.equal(4);
        });

settings:
  encodeUrl: true

docs: |-
  Partial update — envia só `name` e `description`.

  **Espera:** 200, os dois campos atualizados e `event_location`/informações de certificado preservados (não enviados).
